<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Машина с анимацией</title>
    <style>
        .машина {
            width: 200px;         
            height: 120px;        
            margin-top: 250px;    
            position: relative;   
            animation: driveIn 7s ease-out forwards; 
        }

        .основание {
            background-color: red;
            height: 60px;
            width: 100%;          
            border: 3px solid #333;  
            box-sizing: border-box;
            font-size: 20px;       
            font-weight: bold;     
            font-family: sans-serif;
            display: flex;        
            align-items: center;
            justify-content: center;
            position: absolute;
            bottom: 30px;         
            z-index: 2;           
        }

        .стекло {
            background-color: aqua;
            height: 40px;
            width: 100px; 
            border: 3px solid #333;  
            border-radius: 15px 15px 0 0; 
            position: absolute;
            top: 0;                   
            left: 50px;           
            box-sizing: border-box;
            z-index: 1;
        }

        .левое-колесо, .правое-колесо {
            background-color: black;
            height: 50px;
            width: 50px;
            border: 3px solid #333; 
            border-radius: 50%; 
            position: absolute;
            bottom: 0;            
            box-sizing: border-box;
            z-index: 3;
        }

        .левое-колесо {
            left: 20px;
        }

        .правое-колесо {
            right: 20px;
        }

        @keyframes driveIn {
            0% {
                left: -200px; 
            }
            100% {
                left: calc(100vw - 200px - 50px); 
            }
        }

        body {
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <div class="машина">
        <div class="стекло"></div>
        <div class="основание">67</div>
        <div class="левое-колесо"></div>
        <div class="правое-колесо"></div>
    </div>

</body>
</html>
